# Checks on every pull request (into staging and into release). Kept minimal on
# purpose: shellcheck, actionlint and a cargo check for Linux. No tests and no
# packages here; build.yml does those for pull requests into release.
name: checks

on:
  pull_request:
    branches: [staging, release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # release only takes what staging has: changes go feature branch -> staging
  # -> release.
  source-branch:
    if: github.event_name == 'pull_request' && github.base_ref == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Pull requests into release must come from staging
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REF" != staging ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::release takes pull requests from staging only (this one is from $HEAD_REPO:$HEAD_REF)"
            exit 1
          fi

  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: scripts/ci/check.sh
        run: scripts/ci/check.sh
      - name: actionlint
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color
