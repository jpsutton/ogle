# Full build on pull requests into release: tests, every Linux package, and the
# other platforms.
#
# Required for a release: `test` and every Linux package job (`linux (...)`, `arch`).
# Best effort (not required checks; a release ships them only if they built):
#   - macos: universal binary tarball for scripts/install-macos.sh;
#   - windows: zipped ogle.exe;
#   - bsd-check: cargo check for FreeBSD and NetBSD (no BSD packages yet).
#
# release.yml publishes the artifacts of the final PR head without rebuilding.
# workflow_dispatch runs it on any branch, for testing the build itself.
name: build

on:
  pull_request:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

# staging is the head of the staging -> release pull request, so every merge
# into staging pushes to it and starts a new full build. Only the newest head
# matters, so a push cancels the build still running for the previous one.
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --release
      - name: clippy (warnings reported, not fatal)
        run: cargo clippy --locked --release --all-targets

  # One package per distribution release, each built in that release's container so
  # the binary links against its glibc.
  linux:
    name: linux (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "fedora:latest", script: build-rpm.sh, tag: fedora }
          - { image: "rockylinux:9", script: build-rpm.sh, tag: rocky9 }
          - { image: "debian:12", script: build-deb.sh, tag: debian12 }
          - { image: "ubuntu:24.04", script: build-deb.sh, tag: ubuntu2404 }
    steps:
      - uses: actions/checkout@v4
      - name: Build package (${{ matrix.image }} container)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src "${{ matrix.image }}" scripts/ci/${{ matrix.script }}
          sudo chown -R "$(id -u):$(id -g)" out
      - uses: actions/upload-artifact@v4
        with:
          name: ogle-${{ matrix.tag }}
          path: out/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  arch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build Arch package (archlinux container)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src archlinux:latest scripts/ci/build-arch.sh
          sudo chown -R "$(id -u):$(id -g)" out
      - uses: actions/upload-artifact@v4
        with:
          name: ogle-arch
          path: out/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/ci/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ogle-macos
          path: out/*.tar.gz
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build and pack
        run: |
          set -euo pipefail
          version=$(scripts/ci/version.sh)
          cargo build --release --locked
          mkdir -p "out/ogle-$version"
          cp target/release/ogle.exe README.md LICENSE "out/ogle-$version/"
          (cd out && 7z a -bd "ogle-$version-windows-x86_64.zip" "ogle-$version" >/dev/null)
      - uses: actions/upload-artifact@v4
        with:
          name: ogle-windows
          path: out/*.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  bsd-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-freebsd, x86_64-unknown-netbsd]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo check --locked --target ${{ matrix.target }}
