[package]
name = "ogle"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Resource-efficient terminal system monitor inspired by Glances"
license = "LGPL-3.0-or-later"

# Dependency policy (spec GEN-002, 07-performance.md): keep this list minimal.
# - libc: Unix syscalls (termios, poll, sysctl, kill, setpriority...).
# - windows-sys: Win32/NT bindings (feature-gated, zero runtime cost).
# - regex-lite: small linear-time regex engine for filters and hide/show lists.
# No async runtime, no TUI framework, no serde/toml (config uses an in-tree TOML subset parser).

[dependencies]
regex-lite = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Wdk_System_SystemInformation",
    "Wdk_System_Threading",
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
